services:
  - type: web
    name: swadcost-pwa
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Vite bakes VITE_* at build time. Without the anon key, Sign in cannot
    # check swadcost_accounts and must show a connection/config error — never
    # “No account found”. Set these on the Render service and rebuild.
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://stcjwprffdsojfeogfnx.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # SPA fallback. Existing files (/assets/*, robots.txt, sitemap.xml, IndexNow
    # key) are served as-is; unknown paths rewrite to the client shell.
    # Dashboard-created static sites do not read this file — add the same
    # Rewrite /* → /index.html under Settings → Redirects/Rewrites if 404s persist.
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap.xml
        name: Content-Type
        value: text/xml; charset=utf-8
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=300
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
